# Respaldo diario de la base de datos de producción (Supabase). Ver DEPLOY.md.
#
# El repositorio es público: cualquiera puede descargar los artefactos de las
# Actions, así que el respaldo se cifra (GPG, AES-256) con BACKUP_PASSPHRASE
# antes de subirlo. Sin esa contraseña el archivo no se puede abrir.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  cadena de conexión de Supabase (Session pooler, ?sslmode=require)
#   BACKUP_PASSPHRASE    contraseña larga para cifrar los respaldos (guárdala aparte)
name: Respaldo de la base de datos

on:
  schedule:
    - cron: "0 8 * * *" # todos los días a las 08:00 UTC (04:00 en Bolivia)
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar secretos
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Faltan los secretos BACKUP_DATABASE_URL y/o BACKUP_PASSPHRASE."
            exit 1
          fi

      - name: Volcar la base de datos
        # pg_dump 17 desde la imagen oficial (debe ser >= a la versión del servidor).
        run: |
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' > respaldo.dump
          test -s respaldo.dump
          ls -lh respaldo.dump

      - name: Cifrar
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "respaldo-$(date -u +%F).dump.gpg" respaldo.dump
          shred -u respaldo.dump

      - name: Guardar el respaldo cifrado (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-bd-${{ github.run_id }}
          path: respaldo-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
